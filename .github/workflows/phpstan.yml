name: M2 PHPStan
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  phpstan:
    name: M2 PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extdn/github-actions-m2/magento-phpstan/8.5@master
        with:
          composer_name: fom/module-conditional-plugins
          phpstan_level: 5
